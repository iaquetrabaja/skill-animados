name: Comprobar taller
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plantilla/package-lock.json
      - run: python -m unittest discover -s tests
      - run: npm ci
        working-directory: plantilla
      - run: python herramientas/animados.py validar
